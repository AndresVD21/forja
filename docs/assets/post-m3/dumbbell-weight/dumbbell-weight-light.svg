<svg xmlns="http://www.w3.org/2000/svg" width="844" height="892" viewBox="0 0 844 892" role="img" aria-labelledby="title">
<title id="title">Dumbbell weight-entry design in light theme</title>
<rect x="0" y="0" width="844" height="892" rx="0" fill="#F7F8FA" stroke="none"/>
<text x="20" y="34" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="18" font-weight="650" text-anchor="start">English</text>
<g transform="translate(20 52)">
<rect x="0" y="0" width="390" height="820" rx="18" fill="#F7F8FA" stroke="#7E8B9D"/>
<rect x="1" y="1" width="388" height="107" rx="17" fill="#000000" stroke="none"/>
<text x="20" y="48" fill="#B4B4BC" font-family="Geist, system-ui, sans-serif" font-size="24" font-weight="650" text-anchor="start">New workout</text>
<rect x="1" y="77" width="388" height="742" rx="17" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="18" y="115" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="start">New exercise</text>
<text x="18" y="141" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Only visible to you</text>
<rect x="276" y="93" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="324.0" y="121" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Cancel</text>
<rect x="1" y="155" width="388" height="1" rx="0" fill="#CBD2DE" stroke="none"/>
<text x="18" y="187" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Exercise name</text>
<rect x="18" y="195" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="223" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Spider curl</text>
<text x="18" y="266" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Muscle group</text>
<rect x="18" y="274" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="302" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Biceps</text>
<text x="351" y="301" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle">⌄</text>
<text x="18" y="345" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Equipment</text>
<rect x="18" y="353" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="381" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Dumbbell</text>
<text x="351" y="380" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle">⌄</text>
<text x="18" y="434" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Default unit</text>
<rect x="268" y="407" width="48" height="44" rx="12" fill="#101B35" stroke="none"/>
<text x="292.0" y="435" fill="#FFFFFF" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">kg</text>
<rect x="324" y="407" width="48" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="348.0" y="435" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">lb</text>
<text x="18" y="482" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">How do you enter weight?</text>
<text x="18" y="508" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Choose how you record this exercise.</text>
<rect x="18" y="523" width="354" height="100" rx="12" fill="#FFFFFF" stroke="#2155D9"/>
<rect x="30" y="538" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#2155D9"/>
<rect x="35" y="543" width="10" height="10" rx="5" fill="#2155D9" stroke="none"/>
<text x="62" y="550" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="start">Entered weight</text>
<text x="62" y="575" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Enter the weight shown on the machine</text>
<text x="62" y="596" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">or cable, or the weight of one dumbbell.</text>
<rect x="18" y="634" width="354" height="64" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<rect x="30" y="646" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="62" y="658" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="start">Plates per side</text>
<text x="62" y="681" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Plates on one side, excluding the bar.</text>
<rect x="1" y="712" width="388" height="1" rx="0" fill="#CBD2DE" stroke="none"/>
<text x="18" y="735" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="start">Saving adds this exercise to your list,</text>
<text x="18" y="753" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="start">even if you discard the workout.</text>
<rect x="18" y="764" width="354" height="44" rx="12" fill="#101B35" stroke="none"/>
<text x="195.0" y="792" fill="#FFFFFF" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Save exercise and use</text>
</g>
<text x="434" y="34" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="18" font-weight="650" text-anchor="start">Español</text>
<g transform="translate(434 52)">
<rect x="0" y="0" width="390" height="820" rx="18" fill="#F7F8FA" stroke="#7E8B9D"/>
<rect x="1" y="1" width="388" height="107" rx="17" fill="#000000" stroke="none"/>
<text x="20" y="48" fill="#B4B4BC" font-family="Geist, system-ui, sans-serif" font-size="24" font-weight="650" text-anchor="start">Nuevo entrenamiento</text>
