<text x="18" y="115" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="start">Nuevo ejercicio</text>
<text x="18" y="141" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="15" font-weight="400" text-anchor="start">Solo visible para ti</text>
<rect x="276" y="93" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="324.0" y="121" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Cancelar</text>
<rect x="1" y="155" width="388" height="1" rx="0" fill="#CBD2DE" stroke="none"/>
<text x="18" y="187" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Nombre del ejercicio</text>
<rect x="18" y="195" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="223" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Spider curl</text>
<text x="18" y="266" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Grupo muscular</text>
<rect x="18" y="274" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="302" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Bíceps</text>
<text x="351" y="301" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle">⌄</text>
<text x="18" y="345" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Equipo</text>
<rect x="18" y="353" width="354" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="30" y="381" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Mancuerna</text>
<text x="351" y="380" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="500" text-anchor="middle">⌄</text>
<text x="18" y="434" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="550" text-anchor="start">Unidad por defecto</text>
<rect x="268" y="407" width="48" height="44" rx="12" fill="#101B35" stroke="none"/>
<text x="292.0" y="435" fill="#FFFFFF" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">kg</text>
<rect x="324" y="407" width="48" height="44" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="348.0" y="435" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">lb</text>
<text x="18" y="482" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">¿Cómo registras el peso?</text>
<text x="18" y="508" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Elige cómo registras este ejercicio.</text>
<rect x="18" y="523" width="354" height="100" rx="12" fill="#FFFFFF" stroke="#2155D9"/>
<rect x="30" y="538" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#2155D9"/>
<rect x="35" y="543" width="10" height="10" rx="5" fill="#2155D9" stroke="none"/>
<text x="62" y="550" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="start">Peso ingresado</text>
<text x="62" y="575" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Ingresa el peso que marca la máquina</text>
<text x="62" y="596" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">o la polea, o el peso de una mancuerna.</text>
<rect x="18" y="634" width="354" height="64" rx="12" fill="#FFFFFF" stroke="#7E8B9D"/>
<rect x="30" y="646" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#7E8B9D"/>
<text x="62" y="658" fill="#101B35" font-family="Geist, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="start">Discos por lado</text>
<text x="62" y="681" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="400" text-anchor="start">Discos de un lado, sin contar la barra.</text>
<rect x="1" y="712" width="388" height="1" rx="0" fill="#CBD2DE" stroke="none"/>
<text x="18" y="735" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="start">Al guardar, este ejercicio se añade a tu lista</text>
<text x="18" y="753" fill="#526078" font-family="Geist, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="start">aunque descartes el entrenamiento.</text>
<rect x="18" y="764" width="354" height="44" rx="12" fill="#101B35" stroke="none"/>
<text x="195.0" y="792" fill="#FFFFFF" font-family="Geist, system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Guardar ejercicio y usarlo</text>
